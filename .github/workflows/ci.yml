name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      # Fails if pyproject.toml changed without re-running `uv lock`
      - run: uv lock --check
      # The dev group only; the cloud group (Modal) isn't needed to test
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      # Everything runs on CPU with tiny synthetic data: no downloads, no GPU
      - run: uv run pytest
