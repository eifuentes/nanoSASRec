[project]
name = "nanosasrec"
version = "0.3.1"
description = "From SASRec to HSTU, one file at a time"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "numpy>=1.24",
]

[dependency-groups]
cloud = [
    "modal>=1.4.3",
]
dev = [
    "pytest>=8",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py312"
line-length = 119

[tool.ruff.lint]
# Enable Pyflakes (F) and Error (E) codes by default
# Added "I" for sorted imports
select = ["E", "F", "I"]
ignore = ["E501"] 
fixable = ["ALL"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# anyio (a Modal dependency) registers a pytest plugin we don't use; skip it
addopts = "-p no:anyio"
